[project]
name = "fumora"
version = "0.6.2"
description = "Metron-first comic manager: track, download, tag and rename comics."
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8", "lxml>=5.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fumora*"]

[tool.setuptools.package-data]
fumora = ["web/templates/*.html", "web/static/*", "migrations/*.py", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["fumora/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# A table of real release titles; wrapping them would hurt readability.
"tests/test_releases.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
