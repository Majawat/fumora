[project]
name = "fumora"
version = "0.1.0"
description = "Metron-first comic manager: track, download, tag and rename comics."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fumora*"]

[tool.setuptools.package-data]
fumora = ["web/templates/*.html", "web/static/*", "migrations/*.py", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
