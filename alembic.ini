# Used only for generating migrations during development:
#   alembic revision --autogenerate -m "..."
# The app runs migrations itself on startup (fumora/db.py).
[alembic]
script_location = fumora/migrations
sqlalchemy.url = sqlite:///dev.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
