services:
  fumora:
    build: .
    image: fumora:dev
    container_name: fumora
    ports:
      - "8792:8792"
    environment:
      - PUID=99
      - PGID=100
      - UMASK=0002
    volumes:
      - ./data/config:/config
      # TRaSH layout: one /data share holding usenet/, torrents/ and media/,
      # mounted at the same path the download clients use, so imports are
      # hardlinks (torrents keep seeding) or instant moves (usenet).
      # - /mnt/user/data:/data
    restart: unless-stopped
